apiVersion: v1
kind: ConfigMap
metadata:
  name: scamshield-config
  labels:
    app: scamshield
data:
  APP_NAME: "ScamShield"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  LOG_LEVEL: "info"
  HOST: "0.0.0.0"
  PORT: "8000"
  WORKERS: "4"
  CORS_ORIGINS: "https://scamshield.dev"
  OCR_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"
  ENABLE_METRICS: "true"
