apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scamshield-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: scamshield.dev
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: scamshield-backend
            port:
              number: 8000
      - path: /(/?)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: scamshield-frontend
            port:
              number: 80
  tls:
  - hosts:
    - scamshield.dev
    secretName: scamshield-tls
    # TLS certificate is managed by cert-manager via the cluster-issuer annotation above
    # To use a pre-existing secret, remove the cert-manager annotation and ensure the
    # secret 'scamshield-tls' exists with tls.crt and tls.key entries
