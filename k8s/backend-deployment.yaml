apiVersion: apps/v1
kind: Deployment
metadata:
  name: scamshield-backend
  labels:
    app: scamshield
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scamshield
      component: backend
  template:
    metadata:
      labels:
        app: scamshield
        component: backend
    spec:
      containers:
      - name: backend
        image: scamshield/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: scamshield-config
        - secretRef:
            name: scamshield-secrets
        startupProbe:
          httpGet:
            path: /live
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /live
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 15
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_BIND_SERVICE
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: scamshield-backend
  labels:
    app: scamshield
    component: backend
spec:
  selector:
    app: scamshield
    component: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
