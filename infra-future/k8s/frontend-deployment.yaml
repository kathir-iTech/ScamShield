apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaaval-frontend
  labels:
    app: kaaval
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kaaval
      component: frontend
  template:
    metadata:
      labels:
        app: kaaval
        component: frontend
    spec:
      containers:
      - name: frontend
        image: kaaval/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: kaaval-config
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 15
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: kaaval-frontend
  labels:
    app: kaaval
    component: frontend
spec:
  selector:
    app: kaaval
    component: frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
