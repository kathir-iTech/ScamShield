# Secret template for Kaaval
# To generate base64 values:
#   echo -n "your-secret-value" | base64 -w0
#
# Copy this file to secrets.local.yaml and fill in values:
#   cp k8s/secrets.yaml k8s/secrets.local.yaml
# Then edit secrets.local.yaml and apply:
#   kubectl apply -f k8s/secrets.local.yaml
apiVersion: v1
kind: Secret
metadata:
  name: kaaval-secrets
  labels:
    app: kaaval
type: Opaque
data:
  # Generate with: echo -n "your-jwt-secret" | base64 -w0
  SCAMSHIELD_JWT_SECRET: ""
  # Generate with: echo -n "your-admin-api-key" | base64 -w0
  SCAMSHIELD_ADMIN_API_KEY: ""
  # For Redis: echo -n "redis://user:password@host:6379" | base64 -w0
  SCAMSHIELD_REDIS_URL: ""
  # Generate with: echo -n "your-safe-browsing-api-key" | base64 -w0
  SCAMSHIELD_SAFE_BROWSING_API_KEY: ""
  # Generate with: echo -n "your-client-api-key" | base64 -w0
  SCAMSHIELD_CLIENT_API_KEY: ""
