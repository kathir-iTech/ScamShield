apiVersion: v1
kind: ConfigMap
metadata:
  name: wary-config
  labels:
    app: wary
data:
  SCAMSHIELD_ENVIRONMENT: "production"
  SCAMSHIELD_MAX_TEXT_LENGTH: "10000"
  SCAMSHIELD_MAX_FILE_SIZE_MB: "10"
  SCAMSHIELD_RATE_LIMIT_MAX: "100"
  SCAMSHIELD_RATE_LIMIT_WINDOW: "60"
  SCAMSHIELD_MAX_REQUEST_BODY_MB: "5"
  SCAMSHIELD_LOG_LEVEL: "INFO"
  SCAMSHIELD_LOG_FORMAT: "json"
  SCAMSHIELD_LOG_OUTPUT: "both"
  SCAMSHIELD_AUTH_ENABLED: "true"
  SCAMSHIELD_AUTH_ACCESS_TTL: "900"
  SCAMSHIELD_AUTH_REFRESH_TTL: "86400"
  SCAMSHIELD_CORS_ORIGINS: "https://scamshield-frontend-psi.vercel.app"
  SCAMSHIELD_OCR_ENABLED: "true"
  SCAMSHIELD_OCR_LANG: "eng"
  SCAMSHIELD_OCR_MAX_SIZE: "5242880"
