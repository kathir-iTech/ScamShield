name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/unit/ --cov=. --cov-report=term --cov-report=xml -v

      - name: Run integration tests
        run: |
          python -m pytest tests/integration/ -v

      - name: Run security tests
        run: |
          python -m pytest tests/security/ -v

      - name: Coverage quality gate
        run: |
          $coverage = python -c "
import xml.etree.ElementTree as ET
tree = ET.parse('coverage.xml')
root = tree.getroot()
line_rate = float(root.attrib.get('line-rate', 0))
print(f'{line_rate:.4f}')
"
          $threshold = 0.70
          $coverageNum = [double]$coverage
          if ($coverageNum -lt $threshold) {
            Write-Host "FAIL: Line coverage $coverageNum is below threshold $threshold"
            exit 1
          }
          Write-Host "PASS: Line coverage $coverageNum meets threshold $threshold"

      - name: Run chaos tests (non-blocking)
        run: |
          python -m pytest tests/chaos/ -v --timeout=30 || true

      - name: Run benchmark tests (non-blocking)
        run: |
          python -m pytest tests/benchmark/ -v --timeout=60 || true

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run ruff
        run: |
          ruff check . --ignore=E501,F401,E402 || true

      - name: Run mypy (non-blocking)
        run: |
          mypy . --ignore-missing-imports || true
